name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Every commit on main keeps its own
# run, because that run's archives are the ones a release of it attaches.
# Manual recoveries have their own group so queued runs cannot replace each other.
# Dispatch this workflow at a release tag to regenerate expired archives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"

# Verify, the check branch protection requires, passes only when all of them do.
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: validate
      - name: Validate repository
        run: bun run validate
      - uses: ./.github/actions/save-turbo-cache
        if: always()
        with:
          turbo-cache: validate

  # Spyglass's suites scan fixture workspaces with TypeScript workers of their
  # own, so they get runners to themselves instead of starving the others:
  # its `test` task in three Vitest shards.
  test-spyglass:
    name: Test Spyglass (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: test-spyglass-${{ matrix.shard }}
      - name: Test Spyglass if affected
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          SHARD: ${{ matrix.shard }}
        run: bun run turbo run test --affected --filter=@foundry.sh/spyglass -- --shard=$SHARD/3
      - name: Test Spyglass on main and manual runs
        if: github.event_name != 'pull_request'
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run turbo run test --filter=@foundry.sh/spyglass -- --shard=$SHARD/3
      - uses: ./.github/actions/save-turbo-cache
        if: always()
        with:
          turbo-cache: test-spyglass-${{ matrix.shard }}

  test:
    name: Test packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: test
      - name: Test affected packages
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: bun run test --affected --filter=!@foundry.sh/spyglass --concurrency=2 --continue=always
      - name: Test all packages on main and manual runs
        if: github.event_name != 'pull_request'
        run: bun run test --filter=!@foundry.sh/spyglass --concurrency=2 --continue=always
      - uses: ./.github/actions/save-turbo-cache
        if: always()
        with:
          turbo-cache: test

  # The archives a release attaches are built here from source alone: this
  # job restores no Turbo cache, so no cached output can reach them.
  release:
    name: Release archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require manual recovery to build a commit from main
        if: github.event_name == 'workflow_dispatch'
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/setup
      - name: Build packages
        run: bun run build
      - name: Test release and workflow policy
        run: bun run --cwd tooling/release test
      - name: Check public packages
        run: bun run release:check
      - name: Pack and test public packages
        run: bun run release:pack
      - name: Keep the tested archives of this commit for release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-packages
          path: |
            .cache/release/packages.json
            .cache/release/packages/*/*.tgz
            .cache/release/packages/*/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: docs
      - name: Check documentation
        # Validate's workspace typecheck already includes documentation.
        run: bun run docs:check
      - name: Build documentation
        run: bun run docs:build
      - uses: ./.github/actions/save-turbo-cache
        if: always()
        with:
          turbo-cache: docs

  verify:
    name: Verify
    needs: [validate, test-spyglass, test, release, docs]
    # Runs when a job it needs fails, so a failure fails this check
    # instead of skipping it, which branch protection would accept.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
