name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check lint and formatting
        run: bun run check
      - name: Check dependency consistency
        run: bun run lint:deps
      - name: Check types
        run: bun run typecheck
      - name: Check dead code
        run: bun run dead-code
      - name: Test release and workflow policy
        run: bun run --cwd tooling/release test

  build-test:
    name: Package build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Test affected packages
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        # Atlas tests launch TypeScript analysis workers of their own. Keep
        # package suites separate so they do not starve stream and TUI tests.
        run: bun run test --affected --concurrency=1 --continue=always
      - name: Test all packages on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: bun run test --concurrency=1 --continue=always
      - name: Check public packages
        run: bun run release:check
      - name: Pack and test public packages
        run: bun run release:pack

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check documentation
        # Repository checks already typecheck the docs workspace.
        run: bun run docs:check
      - name: Build documentation
        run: bun run docs:build
