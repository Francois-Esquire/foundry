name: Release VS Code Extension

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    outputs:
      sha:
        value: ${{ jobs.assets.outputs.sha }}
      sha256:
        value: ${{ jobs.assets.outputs.sha256 }}
      tag:
        value: ${{ jobs.assets.outputs.tag }}
  workflow_dispatch:
    inputs:
      version:
        description: Exact version of an existing extension GitHub Release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: extension-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  assets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    outputs:
      sha: ${{ steps.collect.outputs.sha }}
      sha256: ${{ steps.collect.outputs.sha256 }}
      tag: ${{ steps.collect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # Missing assets come from successful CI at the tagged commit and are
      # never replaced; the files attached to the release are what moves on.
      - name: Attach and verify the VSIX built by successful release-commit CI
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bun tooling/release/src/extension-cli.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marketplace-extension-${{ inputs.version }}
          path: .cache/extension-release/attached/prompts.vsix
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

