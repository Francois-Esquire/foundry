name: Package Release Assets

on:
  workflow_call:
    inputs:
      package:
        description: App or public library group
        type: string
        default: marbles
      version:
        description: Existing release version; empty selects the highest release
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      package:
        description: App or public library group
        type: choice
        options: [marbles, atlas, libraries]
        default: marbles
      version:
        description: Existing release version, for example 0.0.1
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.package }}-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
      packages: ${{ steps.release.outputs.packages }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve the published release and its commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: bun run release:resolve --package "$RELEASE_PACKAGE" --version "$RELEASE_VERSION"

  assets:
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      RELEASE_PACKAGE: ${{ inputs.package }}
      PACKAGES: ${{ needs.resolve.outputs.packages }}
      RELEASES: ${{ needs.resolve.outputs.releases }}
    steps:
      - name: Check out current archive tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: release-source/package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: release-source
      - name: Validate identity and build the released package
        working-directory: release-source
        run: |
          bun "$GITHUB_WORKSPACE/tooling/release/src/cli.ts" check --root . --package "$RELEASE_PACKAGE" --version "$RELEASE_VERSION"
          mapfile -t filters < <(jq -r '.[].name | "--filter=" + .' <<< "$PACKAGES")
          bun run build "${filters[@]}"
      - name: Apply the Marbles file allowlist when backfilling older releases
        if: inputs.package == 'marbles'
        run: |
          bun -e '
            const current = await Bun.file("apps/marbles/package.json").json();
            const path = "release-source/apps/marbles/package.json";
            const released = await Bun.file(path).json();
            released.files = current.files;
            await Bun.write(path, JSON.stringify(released, null, 2) + "\n");
          '
      - name: Pack, compare npm contents, and test the exact archives
        run: bun run release:pack --root release-source --package "$RELEASE_PACKAGE" --version "$RELEASE_VERSION"
      - name: Attach the verified archives to their releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r artifact; do
            name=$(jq -r .name <<< "$artifact")
            release=$(jq -c --arg name "$name" '.[] | select(.name == $name)' <<< "$RELEASES")
            id=$(jq -r .id <<< "$release")
            tag=$(jq -r .tag <<< "$release")
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" | jq -e --argjson expected "$release" '.id == $expected.id and .tag_name == $expected.tag and .prerelease == $expected.prerelease and (.draft | not) and .published_at != null'
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$RELEASE_SHA"
            tarball="release-source/.cache/release/$(jq -r .archive <<< "$artifact")"
            zip="release-source/.cache/release/$(jq -r .zip <<< "$artifact")"
            gh release upload "$tag" "$tarball" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
            download=$(mktemp -d)
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$download" --pattern "$(basename "$tarball")" --pattern "$(basename "$zip")"
            cmp "$tarball" "$download/$(basename "$tarball")"
            cmp "$zip" "$download/$(basename "$zip")"
            sha256sum "$tarball" "$zip" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.[]' release-source/.cache/release/packages.json)
