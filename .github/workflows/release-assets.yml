name: Package Release Assets

on:
  workflow_call:
    inputs:
      package:
        description: App or public library group
        type: string
        default: marbles
      version:
        description: Existing release version; empty selects the highest release
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      package:
        description: App or public library group whose release needs its CI-built archives
        type: choice
        options: [marbles, spyglass, libraries]
        default: marbles
      version:
        description: Existing release version, for example 0.0.1
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.package }}-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
      packages: ${{ steps.release.outputs.packages }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve the published release and its commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: bun run release:resolve --package "$RELEASE_PACKAGE" --version "$RELEASE_VERSION"

  assets:
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      PACKAGES: ${{ needs.resolve.outputs.packages }}
      RELEASES: ${{ needs.resolve.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Collect the archives CI built and tested at the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tooling/release/src/cli.ts collect --sha "$RELEASE_SHA" --packages "$PACKAGES"
      - name: Attach the verified archives to their releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r artifact; do
            name=$(jq -r .name <<< "$artifact")
            release=$(jq -c --arg name "$name" '.[] | select(.name == $name)' <<< "$RELEASES")
            id=$(jq -r .id <<< "$release")
            tag=$(jq -r .tag <<< "$release")
            current=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id")
            jq -e --argjson expected "$release" '.id == $expected.id and .tag_name == $expected.tag and .prerelease == $expected.prerelease and (.draft | not) and .published_at != null' <<< "$current"
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$RELEASE_SHA"
            tarball=".cache/release/$(jq -r .archive <<< "$artifact")"
            zip=".cache/release/$(jq -r .zip <<< "$artifact")"
            # Attached archives are never replaced; a rerun only confirms them.
            for file in "$tarball" "$zip"; do
              if ! jq -e --arg name "$(basename "$file")" 'any(.assets[]; .name == $name)' <<< "$current" > /dev/null; then
                gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
            download=$(mktemp -d)
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$download" --pattern "$(basename "$tarball")" --pattern "$(basename "$zip")"
            cmp "$tarball" "$download/$(basename "$tarball")"
            cmp "$zip" "$download/$(basename "$zip")"
            sha256sum "$tarball" "$zip" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.[]' .cache/release/packages.json)
