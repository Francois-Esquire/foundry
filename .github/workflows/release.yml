name: Prepare Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  release:
    name: Prepare release PRs and GitHub Releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      assets: ${{ steps.prepare.outputs.assets }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install release tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare releases
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:prepare

  assets:
    needs: [release]
    if: needs.release.outputs.assets != '' && needs.release.outputs.assets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.assets) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}
