name: Prepare Releases

# Releases are cut only from a main commit whose CI build passed; that build's
# tested archives are what the releases carry and npm receives.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  release:
    name: Prepare release PRs and GitHub Releases
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      assets: ${{ steps.prepare.outputs.assets }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Defer to the CI build of the newest main commit
        id: current
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$BUILT_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved past $BUILT_SHA; the CI build of $(git rev-parse HEAD) prepares releases when it passes." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install release tooling
        if: steps.current.outputs.current == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare releases
        id: prepare
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:prepare

  assets:
    needs: [release]
    if: needs.release.outputs.assets != '' && needs.release.outputs.assets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.assets) }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}

  publish:
    name: Start protected npm publication
    needs: [release, assets]
    if: needs.release.outputs.assets != '' && needs.release.outputs.assets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.assets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the verified release to the approval-gated publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PACKAGE: ${{ matrix.package }}
          RELEASE_VERSION: ${{ matrix.version }}
        run: gh workflow run publish.yml --ref main -f "package=$RELEASE_PACKAGE" -f "version=$RELEASE_VERSION"
