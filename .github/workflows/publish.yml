name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: App or public library group to publish from an existing GitHub Release
        type: choice
        required: true
        options: [marbles, spyglass, libraries]
      version:
        description: Exact version; leave empty for the highest released version
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.package }}
  cancel-in-progress: false

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  resolve:
    name: Resolve released package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      component: ${{ steps.release.outputs.component }}
      name: ${{ steps.release.outputs.name }}
      packages: ${{ steps.release.outputs.packages }}
      releases: ${{ steps.release.outputs.releases }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install resolver dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve package, release, and commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bun run release:resolve --package "$RELEASE_PACKAGE" --version "$RELEASE_VERSION"

  verify:
    name: Verify released package archives
    needs: [resolve]
    timeout-minutes: 25
    runs-on: ubuntu-latest
    outputs:
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
    env:
      RELEASE_PACKAGE: ${{ needs.resolve.outputs.component }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASES: ${{ needs.resolve.outputs.releases }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out consumer tests for the released version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: release-source/package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: release-source
      - name: Download release assets and run existing consumer checks
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tooling/release/src/cli.ts fetch --root release-source --package "$RELEASE_PACKAGE" --version "$RELEASE_VERSION" --releases "$RELEASES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: |
            release-source/.cache/release/packages.json
            release-source/.cache/release/packages/*/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved artifact
    needs: [resolve, verify]
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_NAME: ${{ needs.resolve.outputs.name }}
      PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}
      EXPECTED_PACKAGES: ${{ needs.resolve.outputs.packages }}
      RELEASES: ${{ needs.resolve.outputs.releases }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm supports trusted publishing
        run: |
          node --version
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error("Trusted publishing requires npm >=11.5.1. Update the setup-node Node version.");
            }
          ' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
          path: artifact
      - name: Verify tested artifact identity and digest
        run: |
          printf '%s  artifact/packages.json\n' "$MANIFEST_SHA256" | sha256sum --check --strict
          node <<'NODE'
          const fs = require("node:fs");
          const { createHash } = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const artifacts = JSON.parse(fs.readFileSync("artifact/packages.json", "utf8"));
          const expected = JSON.parse(process.env.EXPECTED_PACKAGES);
          const identities = (packages) => packages.map(({ name, version }) => `${name}@${version}`).sort();
          if (!artifacts.length || new Set(artifacts.map(({ name }) => name)).size !== artifacts.length || JSON.stringify(identities(artifacts)) !== JSON.stringify(identities(expected))) {
            throw new Error("Artifacts do not match the selected release members");
          }
          for (const artifact of artifacts) {
            if (!/^packages\/\d{3,}\/[a-zA-Z0-9._+-]+\.tgz$/.test(artifact.archive)) {
              throw new Error("Invalid archive path");
            }
            const path = `artifact/${artifact.archive}`;
            const digest = createHash("sha256").update(fs.readFileSync(path)).digest("hex");
            if (digest !== artifact.sha256) throw new Error("Artifact digest changed");
            const pkg = JSON.parse(execFileSync("tar", ["-xOf", path, "package/package.json"], { encoding: "utf8" }));
            if (pkg.name !== artifact.name || pkg.version !== artifact.version || pkg.version !== process.env.PACKAGE_VERSION || pkg.private === true) {
              throw new Error("Artifact does not match the selected public package and version");
            }
          }
          fs.writeFileSync("artifact/verified-archives.txt", artifacts.map(({ archive }) => archive).join("\n") + "\n");
          NODE
      - name: Verify release and tag have not changed during approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r release; do
            id=$(jq -r .id <<< "$release")
            tag=$(jq -r .tag <<< "$release")
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" | jq -e --argjson expected "$release" '.id == $expected.id and .tag_name == $expected.tag and .prerelease == $expected.prerelease and (.draft | not) and .published_at != null'
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$RELEASE_SHA"
          done < <(jq -c '.[]' <<< "$RELEASES")
      # Every release is npm's latest; 0.0.x maturity is not an npm channel.
      - name: Publish with npm trusted publishing
        run: |
          while IFS= read -r archive; do
            npm publish "artifact/$archive" --ignore-scripts --access public --tag latest --registry https://registry.npmjs.org
          done < artifact/verified-archives.txt
      - name: Record publication
        run: |
          printf 'Published **%s@%s** to `latest` from `%s` (%s).\n\nArtifact manifest SHA-256: `%s`\n' "$PACKAGE_NAME" "$PACKAGE_VERSION" "$RELEASE_TAG" "$RELEASE_SHA" "$MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"
