name: Set up the workspace
description: >
  Installs Node, Bun, and the locked dependencies, and restores the job's
  Turbo cache when the job names one. Run after actions/checkout.

inputs:
  turbo-cache:
    description: >
      Names the job's Turbo cache. Empty restores none, for a job whose
      outputs must be built from source alone.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json
    # A pull request reads its own caches and main's; main reads only main's.
    # The newest cache under the prefix holds every task the job ran last time.
    - name: Restore the Turbo cache
      if: inputs.turbo-cache != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ inputs.turbo-cache }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: turbo-${{ inputs.turbo-cache }}-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
